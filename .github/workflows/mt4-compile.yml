name: mt4-compile

# Compile mt4/Experts/Mt4RiskBot.mq4 on a GitHub-hosted windows-latest runner and publish the .ex4
# as a build artifact, so "merged" and "running" stop being independent facts (straightedge#86).
#
# WHY THIS IS NOT A CONVENIENCE STEP
#
# Until now MQL4 compiled nowhere in CI, so a merged .mq4 carried no information about the binary
# the terminal is executing: #86 measured the live Expert missing three merged PRs. A compile whose
# output is tied to a commit sha makes the pipeline the source of truth for the binary.
#
# THE EXIT CODE IS NOT A GATE, MEASURED NOT QUOTED
#
# On windows-latest 2026-09-26 (straightedge#86, probe runs 36228747784 and 36229301358):
#
#   mt4setup.exe /auto            -> exit 1 on a SUCCESSFUL install
#   metaeditor /compile: <valid>  -> exit 1, log "Result: 0 errors, 0 warnings", .ex4 written
#   metaeditor /compile: <broken> -> exit 0, log "Result: 2 errors, 0 warnings", NO .ex4
#   metaeditor /compile: <absent> -> exit 0, NO log at all, NO .ex4
#
# So the exit status is inverted AND it reports success for a source that does not exist. Nothing in
# this workflow reads it. Every decision is made on the ARTIFACT (exists, non-zero, mtime after a
# recorded start) and on the log's own error and warning counts, and a MISSING log is a failure
# rather than a pass, because an absent check reads like a passed one.
#
# The gate is watched going red on every run, not once: mt4/tests/fixtures/negative-control.mq4
# cannot compile, and the job fails if it ever produces an .ex4 or reports zero errors.
#
# LICENCE CONSTRAINTS (straightedge#87, ernst's reading of the MT4 EULA; mackaye 2026-09-26)
#
#   - mt4setup.exe is fetched from the MetaQuotes CDN, never a broker mirror, and there is NO
#     fallback source: a silent failover would move us onto terms nobody read.
#   - The stub is sha256-pinned and a mismatch FAILS the run. Update the pin deliberately, in a
#     commit that says why; never bypass it.
#   - There is NO cache step, and the only upload is the single .ex4 file by exact path. Clause 2.2
#     forbids distributing the Product or any part of it, and a public repo's Actions cache is
#     restorable by fork PRs, so neither caching nor publishing the MetaEditor binaries is available
#     to us. This is a licence constraint, not hygiene.
#   - ACCEPTED AND RECORDED RISK, so the next person does not re-derive it: whether a GitHub-hosted
#     runner is "Your personal computer" under clause 2.1, and whether clause 2.27's separate MQL4
#     IDE grant covers an unattended CI compile, are unresolved. The EULA is SILENT on automated,
#     headless use, and silent is a finding rather than a permission. Option 1 (download each run)
#     was chosen because it is the only option that avoids every clause naming a prohibited act.
#
# NOT A REQUIRED STATUS CHECK, DELIBERATELY. The stub is a moving target upstream, and a pin
# rotation would otherwise block every unrelated PR in the repo, which is the exact defect class
# this sprint closed elsewhere. Promoting it to a required context is a ruleset decision and belongs
# to whoever owns the ruleset, after the pin has been observed stable.
#
# THE TRUST MODEL, NAMED (straightedge#136)
#
# MetaQuotes republished mt4setup.exe at the same URL on or before 2026-10-08 and the sha256 pin
# refused it, correctly. The question that red raised is what a re-pin actually ASSERTS, and the
# honest answer about the old arrangement is: less than it looked.
#
# A sha256 pin gives IMMUTABILITY. It says "these are the same bytes as last time". It does not say
# where those bytes came from, and the legitimacy of the ORIGINAL pinned build rested on nothing
# more than "it arrived over HTTPS from their CDN" -- exactly the evidence a re-pin would have, which
# is why rollins was right that bumping the number would have changed the number without changing
# what is verified.
#
# An Authenticode check gives PROVENANCE. It says "MetaQuotes signed this, the chain validates, and
# a timestamp authority countersigned it". That is a cryptographic statement about origin, and it is
# the property the pin never had.
#
# These are not stronger-versus-weaker, they are different properties, so the gate now asserts BOTH
# and trades neither:
#
#   - Authenticode `Valid` plus the pinned publisher subject is a HARD gate. No human waves it
#     through, and a republish signed by anyone else fails closed.
#   - The sha256 pin stays, so a legitimately republished build still stops the run and still needs
#     a person. What changed is that the person now has something real to assert: the job prints the
#     signer subject, issuer, thumbprint, certificate validity window, countersignature and file
#     version, and the re-pin commit quotes them.
#
# Accepted cost, stated rather than discovered: pinning the SUBJECT and not the thumbprint means a
# certificate renewal by the same publisher does not break the build, and in exchange a cert
# mis-issued to that subject by any trusted CA would pass provenance. The thumbprint is therefore
# REPORTED on every run and belongs in the re-pin commit, so a rotation is visible to a reader even
# though it is not a gate. Pinning the thumbprint instead would hand the vendor's certificate
# calendar the power to red this repo, which is the failure this job's own design already rejects
# two paragraphs up.
#
# RE-PINNING CHECKLIST, because the next person should not have to re-derive this.
#
# When MT4_SETUP_SHA256 reds and provenance PASSED, that is a legitimately signed MetaQuotes build
# that this repo has not reviewed. It is a review trigger, not a bypass. Do all four:
#
#   1. Read the Authenticode block this job printed in the step BEFORE the hash gate. If the run
#      died before printing it, re-run; do not re-pin from a hash alone.
#   2. Confirm status Valid, the publisher subject, and that the countersignature is present.
#   3. Update MT4_SETUP_SHA256 in a commit whose body QUOTES the signer subject, thumbprint,
#      countersigner and file version, and names the run id they were read from. A pin whose
#      update rule is "whatever the CDN served today" is a checksum, not a control.
#   4. Confirm the re-run is green AND that the negative controls still fire: the byte-flipped
#      copy must not validate, and mt4/tests/fixtures/negative-control.mq4 must still fail to
#      compile. A green job that cannot go red is worth less than the red one it replaced.
#
# Never: a fallback download source, a widened or removed path filter, continue-on-error, or a
# re-pin with no statement of what was verified (straightedge#87, straightedge#136).
#
# WHAT THIS DOES NOT ESTABLISH, stated so it is not over-read: the 873af0c7 build's signature was
# never recorded and the vendor overwrote it at the same URL, so it cannot be fetched now. This
# commit therefore sets the publisher BASELINE; it does not prove the new build carries the same
# publisher as the old one. From here a publisher change is detectable. Before here it was not.
#
# WHY A SCHEDULE. The PR trigger is path-filtered to mt4/** on purpose, so a vendor republish does
# not red every unrelated PR. The cost of that, measured: the last run before 2026-10-08 was
# 2026-09-27, so the broken pin was LATENT for eleven days and surfaced inside a PR about reconnect
# observability that had nothing to do with it. `main` was not green on this check, it was
# unmeasured on it. The weekly schedule makes a republish surface as its own attributable red, on
# our clock, without widening the path filter -- which #136 rules out, because a job that stops
# running is not a gate.

on:
  pull_request:
    paths:
      - "mt4/**"
      - ".github/workflows/mt4-compile.yml"
  push:
    branches: [main]
    paths:
      - "mt4/**"
      - ".github/workflows/mt4-compile.yml"
  # See WHY A SCHEDULE in the header. Weekly, not daily: the purpose is to make a vendor
  # republish attributable and bounded in latency, not to alert within hours. A republish is a
  # review trigger, not an incident.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mt4-compile-${{ github.ref }}
  cancel-in-progress: true

env:
  # MetaQuotes CDN web stub. No fallback URL by design (straightedge#87).
  MT4_SETUP_URL: https://download.mql5.com/cdn/web/metaquotes.software.corp/mt4/mt4setup.exe
  # Measured on run 37801966568, the EXECUTED output lines and not the echoed script:
  #   bytes=5197480  version 5.0.0.6236  Authenticode Valid, "Signature verified."
  # It replaces 873af0c7... at 4699304 bytes (2026-09-26), which MetaQuotes overwrote at the same
  # URL. A 498KB size change on a vendor stub is consistent with a real new build rather than a
  # truncated or corrupted download, and the signature is what actually establishes that.
  MT4_SETUP_SHA256: 8088bafcbe17aa98c5c3ac7028533caeb97b37ede99a5e59907161edbe5a0eeb
  # Authenticode signer subject. PROVENANCE, where the hash above is immutability; see THE TRUST
  # MODEL in the header. Matched as a substring of the signer's full Subject, measured on run
  # 37801966568 as:
  #   CN=MetaQuotes Ltd., O=MetaQuotes Ltd., S=Lemesos, C=CY
  # The ORGANISATION field is pinned rather than the whole subject or the CN. O is the field a CA
  # validates for an OV code-signing certificate, so it is the part that carries the identity
  # claim, and pinning it survives a CN edit or a field reordering that would break a
  # whole-string compare for no security gain.
  MT4_SETUP_PUBLISHER: "O=MetaQuotes Ltd."
  # RECORDED, NOT GATED. A renewal by the same publisher rotates this and must not red the repo;
  # see the accepted cost in the header. A change produces a ::warning so it is visible to a
  # reader rather than silent. Issued by CN=Sectigo Public Code Signing CA E36, valid
  # 2026-02-10 to 2029-02-09, countersigned by CN=Certum Timestamp 2026.
  MT4_SETUP_PUBLISHER_THUMBPRINT_SEEN: "5A64A7AED24C33DED342D01D01FA5286F06DA6DC"
  METAEDITOR: C:\Program Files (x86)\MetaTrader 4\metaeditor.exe
  EXPERT_SOURCE: mt4\Experts\Mt4RiskBot.mq4
  NEGATIVE_CONTROL: mt4\tests\fixtures\negative-control.mq4

jobs:
  mt4-compile:
    name: mt4-compile
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch mt4setup.exe from the MetaQuotes CDN
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = Join-Path $env:RUNNER_TEMP "mt4setup.exe"
          # No fallback URL, by design (straightedge#87): a silent failover would move us onto
          # terms nobody read.
          Invoke-WebRequest -Uri $env:MT4_SETUP_URL -OutFile $dest -UseBasicParsing
          $fi = Get-Item $dest
          $sha = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLower()
          Write-Host "mt4setup.exe bytes=$($fi.Length) sha256=$sha"

      - name: Report the Authenticode block, then gate on provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = Join-Path $env:RUNNER_TEMP "mt4setup.exe"

          # REPORT FIRST, GATE SECOND, and the order is the point: when the hash pin reds on a
          # legitimate republish, the operator needs these fields in the SAME run to be able to
          # write a re-pin commit that asserts something. A gate that exits before printing its
          # evidence makes the remediation a second round trip.
          $sig = Get-AuthenticodeSignature -LiteralPath $dest
          $cert = $sig.SignerCertificate
          Write-Host "authenticode status      = $($sig.Status)"
          Write-Host "authenticode message     = $($sig.StatusMessage)"
          if ($null -ne $cert) {
            Write-Host "signer subject           = $($cert.Subject)"
            Write-Host "signer issuer            = $($cert.Issuer)"
            Write-Host "signer thumbprint        = $($cert.Thumbprint)"
            Write-Host "signer not before        = $($cert.NotBefore.ToString('o'))"
            Write-Host "signer not after         = $($cert.NotAfter.ToString('o'))"
          } else {
            Write-Host "signer subject           = (no signer certificate)"
          }
          $ts = $sig.TimeStamperCertificate
          if ($null -ne $ts) {
            Write-Host "countersigned by         = $($ts.Subject)"
          } else {
            # Reported, not gated. An unsigned-timestamp build is worth a human looking at it, but
            # refusing it would be a new policy, and this job is not the place to invent one.
            Write-Host "countersigned by         = (none; the signature is not timestamped)"
          }
          $v = (Get-Item -LiteralPath $dest).VersionInfo
          Write-Host "file version             = $($v.FileVersion)"
          Write-Host "product version          = $($v.ProductVersion)"
          Write-Host "company name             = $($v.CompanyName)"

          # NEGATIVE CONTROL for this gate, on every run, same discipline as the compile step.
          # Flipping one byte of a copy must make the signature stop validating. Without this, a
          # runner whose trust store or revocation path was misconfigured could return Valid for
          # anything, and `status -eq Valid` would be a decoration that cannot go red. It is also
          # the only way to know the check is reading the FILE rather than a cached verdict.
          $tampered = Join-Path $env:RUNNER_TEMP "mt4setup-tampered.exe"
          Copy-Item -LiteralPath $dest -Destination $tampered -Force
          $fs = [System.IO.File]::Open($tampered, "Open", "ReadWrite")
          try {
            # Inside the PE, past the headers, so the edit lands in signed content rather than in
            # a field the signature excludes.
            $fs.Seek(4096, "Begin") | Out-Null
            $b = $fs.ReadByte()
            $fs.Seek(4096, "Begin") | Out-Null
            $fs.WriteByte([byte](($b + 1) % 256))
          } finally {
            $fs.Close()
          }
          $control = (Get-AuthenticodeSignature -LiteralPath $tampered).Status
          Write-Host "negative control status  = $control (a tampered copy)"
          Remove-Item -LiteralPath $tampered -Force
          if ($control -eq "Valid") {
            Write-Host "::error::a byte-flipped copy of the stub ALSO validated, so this signature check cannot go red and proves nothing about the real file. Do not treat this run as having verified provenance."
            exit 1
          }

          # GATE 1: provenance. Hard, and no human waves it through.
          if ($sig.Status -ne "Valid") {
            Write-Host "::error::mt4setup.exe Authenticode status is $($sig.Status), not Valid. The stub is unsigned, tampered, or its chain does not validate on this runner. Do NOT re-pin a hash to make this pass and do NOT add a fallback download source (straightedge#87)."
            exit 1
          }
          if ($null -eq $cert) {
            Write-Host "::error::Authenticode reported Valid with no signer certificate, which this gate cannot interpret; treating as unverified."
            exit 1
          }
          if ($env:MT4_SETUP_PUBLISHER -eq "MEASURED_IN_CI_SEE_COMMIT") {
            Write-Host "::error::MT4_SETUP_PUBLISHER is still the placeholder, so the publisher is UNPINNED and this run verified a valid signature by ANYONE. Read the signer subject printed above and pin it. An unset pin is not a passed check (straightedge#136)."
            exit 1
          }
          if ($cert.Subject -notlike "*$($env:MT4_SETUP_PUBLISHER)*") {
            Write-Host "::error::mt4setup.exe is validly signed, but by $($cert.Subject), which does not contain the pinned publisher $($env:MT4_SETUP_PUBLISHER). A different publisher is not a pin rotation; stop and escalate."
            exit 1
          }
          Write-Host "provenance ok: valid signature, publisher matches the pin"
          if ($cert.Thumbprint -ne $env:MT4_SETUP_PUBLISHER_THUMBPRINT_SEEN) {
            # A WARNING and not a gate, deliberately: see the accepted cost in the header. The
            # publisher is what is pinned; the thumbprint is recorded so a rotation is visible to
            # a reader instead of silent.
            Write-Host "::warning::the signing certificate thumbprint is $($cert.Thumbprint), where $($env:MT4_SETUP_PUBLISHER_THUMBPRINT_SEEN) was recorded. Same publisher, different certificate. Legitimate on renewal; update MT4_SETUP_PUBLISHER_THUMBPRINT_SEEN in the next commit that touches this file and say which run you read it from."
          }

      - name: Gate on the sha256 pin, which is the exact build we reviewed
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = Join-Path $env:RUNNER_TEMP "mt4setup.exe"
          $sha = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLower()
          if ($sha -ne $env:MT4_SETUP_SHA256) {
            Write-Host "::error::mt4setup.exe sha256 is $sha, pinned MT4_SETUP_SHA256 is $($env:MT4_SETUP_SHA256)."
            Write-Host "::error::Provenance PASSED, so this is a legitimately signed MetaQuotes build that is not the one this repo reviewed. That is a review trigger, not a bypass: read the Authenticode block printed in the previous step, update MT4_SETUP_SHA256 in a commit that quotes the signer subject, thumbprint, countersignature and file version you read, and say which run you read them from. Do NOT add a fallback download source (straightedge#87)."
            exit 1
          }
          Write-Host "pin matches: same build this repo reviewed"

      - name: Install MetaTrader 4 silently
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $setup = Join-Path $env:RUNNER_TEMP "mt4setup.exe"
          $p = Start-Process -FilePath $setup -ArgumentList "/auto" -PassThru
          if (-not $p.WaitForExit(600000)) {
            Write-Host "::error::mt4setup.exe /auto did not finish within 600s"
            try { $p.Kill() } catch { }
            exit 1
          }
          # Recorded, never trusted: exit 1 is what a SUCCESSFUL install returns.
          Write-Host "installer exit code (not a gate): $($p.ExitCode)"
          if (-not (Test-Path -LiteralPath $env:METAEDITOR)) {
            Write-Host "::error::no MetaEditor at $($env:METAEDITOR) after a silent install"
            $hits = @(Get-ChildItem -Path "C:\Program Files (x86)" -Filter "metaeditor*.exe" -Recurse -ErrorAction SilentlyContinue -Force |
                      Select-Object -ExpandProperty FullName)
            Write-Host "::error::bounded search under C:\Program Files (x86) found $($hits.Count) candidate(s)"
            foreach ($h in $hits) { Write-Host "::error::candidate $h" }
            exit 1
          }
          Write-Host "MetaEditor present at $($env:METAEDITOR)"

      - name: Compile, and assert on the artifact and the log counts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          function Invoke-Mql4Compile {
            param([string]$Source, [string]$Tag)
            $abs = Join-Path (Get-Location) $Source
            if (-not (Test-Path -LiteralPath $abs)) {
              Write-Host "::error::source not found: $abs"
              return $null
            }
            $ex4 = [System.IO.Path]::ChangeExtension($abs, ".ex4")
            $log = Join-Path $env:RUNNER_TEMP "$Tag.log"
            # 1. A stale .ex4 would pass every assertion below, so it goes first.
            if (Test-Path -LiteralPath $ex4) { Remove-Item -Force -LiteralPath $ex4 }
            if (Test-Path -LiteralPath $log) { Remove-Item -Force -LiteralPath $log }
            # 2. Start timestamp, with a margin wider than the filesystem timestamp resolution so
            #    "fresh" cannot be true by rounding.
            $start = Get-Date
            Start-Sleep -Milliseconds 1100
            $proc = Start-Process -FilePath $env:METAEDITOR -ArgumentList @("/compile:$abs", "/log:$log") -PassThru -Wait
            Write-Host "[$Tag] metaeditor exit code (not a gate): $($proc.ExitCode)"
            # 3. Read the log. It is UTF-16 on this build; fall back rather than guessing.
            $text = $null
            if (Test-Path -LiteralPath $log) {
              $text = Get-Content -LiteralPath $log -Raw -Encoding unicode -ErrorAction SilentlyContinue
              if (-not $text -or -not ($text -match "[A-Za-z]")) {
                $text = Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue
              }
              foreach ($line in ($text -split "`r?`n")) { if ($line.Trim()) { Write-Host "[$Tag] $line" } }
            } else {
              Write-Host "[$Tag] NO COMPILE LOG WRITTEN"
            }
            # 4. Parse the counts. No match means the counts are UNKNOWN, which is never a pass.
            $errors = $null
            $warnings = $null
            if ($text -and ($text -match "Result:\s*(\d+)\s*errors?,\s*(\d+)\s*warnings?")) {
              $errors = [int]$Matches[1]
              $warnings = [int]$Matches[2]
            }
            $exists = Test-Path -LiteralPath $ex4
            $bytes = 0
            $fresh = $false
            if ($exists) {
              $fi = Get-Item -LiteralPath $ex4
              $bytes = $fi.Length
              $fresh = $fi.LastWriteTime -gt $start
              Write-Host "[$Tag] ex4 bytes=$bytes mtime=$($fi.LastWriteTime.ToString('o')) start=$($start.ToString('o')) fresh=$fresh"
            } else {
              Write-Host "[$Tag] no .ex4 produced"
            }
            return [pscustomobject]@{
              Ex4 = $ex4; Exists = $exists; Bytes = $bytes; Fresh = $fresh
              Errors = $errors; Warnings = $warnings; HasLog = ($null -ne $text)
            }
          }

          $failed = 0

          # THE REAL EXPERT. Must produce a fresh, non-empty .ex4 with zero errors and zero
          # warnings. #property strict is on, so zero warnings is cheap to keep.
          $r = Invoke-Mql4Compile -Source $env:EXPERT_SOURCE -Tag "expert"
          if ($null -eq $r) { exit 1 }
          if (-not $r.HasLog) { Write-Host "::error::no compile log for the Expert; counts unknown, which is not a pass"; $failed = 1 }
          if ($null -eq $r.Errors) { Write-Host "::error::could not parse a Result line from the Expert compile log; counts unknown, which is not a pass"; $failed = 1 }
          elseif ($r.Errors -ne 0) { Write-Host "::error::Expert compiled with $($r.Errors) error(s)"; $failed = 1 }
          elseif ($r.Warnings -ne 0) { Write-Host "::error::Expert compiled with $($r.Warnings) warning(s); #property strict is on, keep it at zero"; $failed = 1 }
          if (-not $r.Exists) { Write-Host "::error::no .ex4 produced for the Expert"; $failed = 1 }
          elseif ($r.Bytes -le 0) { Write-Host "::error::.ex4 is zero length"; $failed = 1 }
          elseif (-not $r.Fresh) { Write-Host "::error::.ex4 mtime is not after this compile started; it is a stale binary"; $failed = 1 }

          # NEGATIVE CONTROL, every run. If a source that cannot compile still yields an .ex4, or
          # reports no errors, then the assertions above are not measuring anything.
          $n = Invoke-Mql4Compile -Source $env:NEGATIVE_CONTROL -Tag "negative-control"
          if ($null -eq $n) { Write-Host "::error::negative control fixture is missing; the gate cannot prove it can go red"; exit 1 }
          if ($n.Exists) { Write-Host "::error::negative control produced an .ex4; the artifact assertion is not measuring anything"; $failed = 1 }
          if ($null -eq $n.Errors) { Write-Host "::error::negative control produced no parseable Result line; the log assertion is not measuring anything"; $failed = 1 }
          elseif ($n.Errors -lt 1) { Write-Host "::error::negative control reported $($n.Errors) errors; it is supposed to fail to compile"; $failed = 1 }
          if ($failed -eq 0) { Write-Host "Expert compiled clean, and the negative control failed to compile as designed" }
          exit $failed

      - name: Publish the .ex4 for this commit
        uses: actions/upload-artifact@v7
        with:
          # Exact path, never a glob. Nothing in this workflow may upload anything from the
          # MetaTrader install directory (straightedge#87 clause 2.2).
          # github.sha on a pull_request event is the EPHEMERAL MERGE COMMIT, which will not
          # exist after the merge, so an artifact named after it cannot be traced back to any
          # commit on main. Measured on this PR: the first run published
          # Mt4RiskBot-ex4-8ea47886..., a merge commit, while the branch head was 5fadce62.
          # head.sha names the commit a human can check out; github.sha is correct on push.
          name: Mt4RiskBot-ex4-${{ github.event.pull_request.head.sha || github.sha }}
          path: mt4/Experts/Mt4RiskBot.ex4
          if-no-files-found: error
          retention-days: 90
