name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-matrix:
    name: ci-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q -rs --override-ini addopts=
      - run: python -m straightedge doctor

  # The pytest suite audits the DECLARED task XML on every platform, which
  # proves the declaration satisfies its own rule. It cannot prove that Task
  # Scheduler accepts the file, and an XML this repo can parse but Windows
  # rejects is a deploy artifact that fails for the first time on the live
  # real-money box. So this job registers both declarations for real, dumps
  # them back out of Task Scheduler, and audits the DUMP: the round trip is
  # what makes the artifact trustworthy. It is also the only coverage the two
  # PowerShell scripts get.
  supervision-xml:
    name: supervision-xml
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: register both declared tasks from their XML
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          .\deploy\windows\Install-Supervision.ps1 `
            -PythonExe $python `
            -ConfigPath "$PWD\config.example.toml" `
            -WorkingDirectory "$PWD" `
            -BackupDir "$PWD\tasks-before" `
            -Apply
      - name: dump what Task Scheduler actually holds, and audit THAT
        shell: pwsh
        run: |
          .\deploy\windows\Export-Tasks.ps1 -OutDir "$PWD\tasks"
          # Every declared task must have produced a dump. An empty directory
          # would audit as task_missing, which is a red this step would then
          # be reporting as a schema problem.
          foreach ($name in @("straightedge-desk", "straightedge-watch")) {
            if (-not (Test-Path "$PWD\tasks\$name.xml")) {
              throw "$name was registered and did not dump; the round trip is broken"
            }
            # The liveness sidecar (#151). The audit reports
            # liveness_unmeasured without it, so an exporter that silently
            # stopped writing it would turn every live audit back into a
            # declaration audit, which is the defect being closed here.
            if (-not (Test-Path "$PWD\tasks\$name.info.json")) {
              throw "$name dumped no .info.json; the liveness half of the audit is unmeasured"
            }
          }
          Get-Content "$PWD\tasks\straightedge-desk.info.json"
          python -m straightedge --config config.example.toml supervision --tasks "$PWD\tasks"
          if ($LASTEXITCODE -ne 0) { throw "the audit failed on a dump of the declarations this repo ships" }
      - name: the audit can still go red on this runner
        shell: pwsh
        run: |
          # The control of the control. A green audit above proves nothing
          # unless the same command on the same runner can fail, so the desk
          # task loses its repeating trigger and the audit must red.
          Set-ScheduledTask -TaskName straightedge-desk -Trigger (New-ScheduledTaskTrigger -AtLogOn) | Out-Null
          .\deploy\windows\Export-Tasks.ps1 -OutDir "$PWD\tasks-red"
          python -m straightedge --config config.example.toml supervision --tasks "$PWD\tasks-red"
          if ($LASTEXITCODE -eq 0) { throw "the audit passed a desk task with no repeating trigger, which is the measured 2026-10-08 defect" }
          Write-Host "the audit went red on a logon-only desk task, as it must"
          # A pwsh step exits with $LASTEXITCODE, which is still the 1 this
          # step WANTED from the audit. Without this the control passing looks
          # identical to the control failing, which is the shape of defect this
          # whole job exists to catch.
          exit 0
      # THE SHAPE THAT ACTUALLY HAPPENED, against real Task Scheduler (#151).
      #
      # The control above removes the repetition entirely, which is the easy
      # case any trigger check catches. The live box's desk task had its PT5M
      # repetition sitting ON the LogonTrigger, which is why a human reading
      # that XML concluded it was supervised, and measured against the audit as
      # merged in #146 that shape returned ZERO findings and exit 0.
      #
      # A unit fixture proves the decision path. Only Task Scheduler proves
      # that this is a shape it accepts and what it then reports for
      # NextRunTime, so the shape is registered for real here.
      - name: the audit reds on the shape that passed it, registered for real
        shell: pwsh
        run: |
          $logon = New-ScheduledTaskTrigger -AtLogOn
          # The documented idiom for hanging a repetition on a non-time
          # trigger: build a throwaway -Once trigger for its Repetition and
          # graft that onto the logon trigger.
          $donor = New-ScheduledTaskTrigger -Once -At (Get-Date) `
            -RepetitionInterval (New-TimeSpan -Minutes 5)
          $logon.Repetition = $donor.Repetition
          Set-ScheduledTask -TaskName straightedge-desk -Trigger $logon | Out-Null
          .\deploy\windows\Export-Tasks.ps1 -OutDir "$PWD\tasks-prefix"
          # Printed before the assertion, because if Task Scheduler reports
          # this shape differently from the live box then THAT is the finding
          # and a bare red would hide it.
          Write-Host "--- what Task Scheduler holds for the pre-fix shape ---"
          Get-Content "$PWD\tasks-prefix\straightedge-desk.info.json"
          Select-String -Path "$PWD\tasks-prefix\straightedge-desk.xml" -Pattern "Repetition|Interval|LogonTrigger|TimeTrigger"
          $out = python -m straightedge --config config.example.toml supervision --tasks "$PWD\tasks-prefix" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -eq 0) {
            throw "the audit PASSED a PT5M repetition hung on a LogonTrigger. That is the exact shape that ran zero times in twelve days on the live box, and #151 exists because the merged audit returned exit 0 on it"
          }
          if ($out -notmatch "repetition_not_on_a_clock") {
            throw "the audit went red, but not for the #151 reason; it must name repetition_not_on_a_clock so the finding does not contradict the artifact"
          }
          Write-Host "the audit named repetition_not_on_a_clock against real Task Scheduler, as it must"
          exit 0
      # Deploy-Desk.ps1 is PowerShell that cannot run on a Mac at all, so
      # without this its first execution would be against a live real-money
      # box. A dry run proves it parses, that the preflight reads a real git
      # checkout, and that it records a rollback point; it does not prove the
      # task disable/enable or the checkout, which need a desk to stop.
      - name: the deploy script's dry run, against a real checkout
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          New-Item -ItemType Directory -Force -Path "$PWD\..\se-state" | Out-Null
          $state = (Resolve-Path "$PWD\..\se-state").Path
          Copy-Item config.example.toml (Join-Path $state "config.toml")
          # No -BookIsFlat: the script must STOP at the judgement gate and exit
          # 0, because stopping a live autonomous desk is not its decision.
          .\deploy\windows\Deploy-Desk.ps1 -Ref HEAD -Repo "$PWD" -StateDir $state `
            -ConfigPath (Join-Path $state "config.toml") -PythonExe $python `
            -RecordDir (Join-Path $state "deploys")
          if ($LASTEXITCODE -ne 0) { throw "the dry run without -BookIsFlat should exit 0 at the judgement gate, got $LASTEXITCODE" }
          # With the gate passed it must traverse the rest without changing
          # anything, because -Apply is still absent.
          .\deploy\windows\Deploy-Desk.ps1 -Ref HEAD -Repo "$PWD" -StateDir $state `
            -ConfigPath (Join-Path $state "config.toml") -PythonExe $python `
            -RecordDir (Join-Path $state "deploys") -BookIsFlat
          if ($LASTEXITCODE -ne 0) { throw "the full dry run failed: $LASTEXITCODE" }
          if (Test-Path (Join-Path $state "journal.deployed.json")) { throw "a DRY RUN wrote the deploy stamp; -Apply is not gating writes" }
          if (Test-Path (Join-Path $state "deploys")) { throw "a DRY RUN created the rollback record directory" }
          Write-Host "dry run changed nothing, as it must"
      - name: the deploy script REFUSES a state dir inside the checkout
        shell: pwsh
        run: |
          # The negative control for the single most destructive mistake this
          # procedure could make: a hard checkout with the live journal inside
          # the tree would delete the audit log of every trade the desk has
          # ever made. A refusal nobody has watched fire is not a refusal.
          $python = (Get-Command python).Source
          $inside = "$PWD\se-state-inside"
          New-Item -ItemType Directory -Force -Path $inside | Out-Null
          Copy-Item config.example.toml (Join-Path $inside "config.toml")
          $ok = $false
          try {
            .\deploy\windows\Deploy-Desk.ps1 -Ref HEAD -Repo "$PWD" -StateDir $inside `
              -ConfigPath (Join-Path $inside "config.toml") -PythonExe $python 2>&1 | Write-Host
          } catch {
            $ok = $true
            Write-Host "refused as designed: $($_.Exception.Message)"
          }
          if (-not $ok) { throw "the script ACCEPTED a state dir inside the checkout, so the guard that protects the live journal cannot fire" }
          Remove-Item -Recurse -Force $inside
      - name: unregister
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @("straightedge-desk", "straightedge-watch")) {
            Unregister-ScheduledTask -TaskName $name -Confirm:$false -ErrorAction SilentlyContinue
          }

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: mypy src/straightedge

  # The org ruleset (aviation-grade-main-org, 18677665) requires status
  # checks literally named `ci`, `coverage`, `CodeQL` -- nothing else is at
  # the merge gate. A matrix job reports as `ci-matrix (os, python-version)`,
  # never the bare name, and agent-typecheck / agent-test are not in the
  # ruleset at all, so without this job a Worker test failure cannot block a
  # merge. This aggregator owns the stable `ci` context and needs every
  # ci-matrix leg plus both agent jobs, failing if any of them did not
  # succeed. Runs with if: always() because a needs-only job is SKIPPED, not
  # failed, when an upstream job fails or is itself skipped -- and skipped
  # is not the red this check exists to produce.

  # RETARGETED by straightedge#259's fragment half: this gate now requires a
  # `changelog.d/<issue>-<slug>.md` file and a `CHANGELOG.md` edit does NOT
  # satisfy it. The SUBJECT of this one gate moved rather than a second gate
  # being written beside it, because two checks asking one question in two
  # spellings is the rebuilt-consumer defect docs/TESTING.md has an entry about.
  #
  # THE OTHER HALF OF THE CONTRACT IS NOT WIRED HERE ON PURPOSE.
  # `tests/changelog_assemble.py --check` (fragment names, and the invariant
  # that `## Unreleased` carries no entries) runs through `pytest` in
  # `ci-matrix`, which is already in this workflow's `ci` needs. Adding a step
  # for it here would duplicate a check that already gates. docs/RELEASING.md
  # is the contract in prose.
  #
  # straightedge#259. A changelog entry was a convention with no trigger: five
  # recent merges fired it in BOTH directions, so the entry/no-entry split was
  # uncorrelated with whether `src/` changed. A rule that is inferred gets
  # applied when somebody remembers.
  #
  # WIRED INTO `ci`'s `needs` RATHER THAN LEFT AS ITS OWN ROW, because only
  # `ci` and `coverage` are required contexts on `main`: a new top-level row
  # would go red visibly and block nothing, which is decoration. Through `ci`
  # it actually gates.
  #
  # NO `if:` ON THE JOB, on purpose. A `needs` job that is SKIPPED reports
  # `skipped`, not `success`, and the aggregator below compares against
  # `success`, so an `if: github.event_name == 'pull_request'` here would fail
  # `ci` on every push to `main`. The job runs always and decides inside.
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          # The gate diffs base...head, so a shallow clone cannot see the range.
          fetch-depth: 0

      # A guard nobody has watched fail is decoration, so the controls run
      # BEFORE the real verdict and the suite prints its own case count.
      - name: self-test the gate (positive and negative controls)
        run: python3 tests/changelog_gate.py --self-test

      - name: a src/ change requires a changelog.d/ fragment
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          # THROUGH THE ENVIRONMENT, never interpolated into the shell. A pull
          # request body is attacker-controlled text and `${{ }}` substitution
          # happens before the shell parses the line, so inlining it is command
          # injection with extra steps.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tests/changelog_gate.py

      - name: not a pull request
        if: github.event_name != 'pull_request'
        run: |
          echo "event is ${{ github.event_name }}, not a pull request."
          echo "Nothing to gate: a push to main carries changes that were"
          echo "already gated at pull request time. Reported rather than"
          echo "silently passing an empty range."

  ci:
    name: ci
    needs: [ci-matrix, lint, agent, agent-test, supervision-xml, changelog]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: require every upstream job to have succeeded
        run: |
          echo "ci-matrix result: ${{ needs.ci-matrix.result }}"
          echo "lint result: ${{ needs.lint.result }}"
          echo "agent-typecheck result: ${{ needs.agent.result }}"
          echo "agent-test result: ${{ needs.agent-test.result }}"
          echo "supervision-xml result: ${{ needs.supervision-xml.result }}"
          echo "changelog result: ${{ needs.changelog.result }}"
          if [ "${{ needs.ci-matrix.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.agent.result }}" != "success" ] || \
             [ "${{ needs.agent-test.result }}" != "success" ] || \
             [ "${{ needs.supervision-xml.result }}" != "success" ] || \
             [ "${{ needs.changelog.result }}" != "success" ]; then
            echo "an upstream job did not succeed; failing the required ci check"
            exit 1
          fi

  agent:
    name: agent-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
        working-directory: agent
      - run: npm run typecheck
        working-directory: agent

  agent-test:
    name: agent-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
        working-directory: agent
      - run: npm test
        working-directory: agent
