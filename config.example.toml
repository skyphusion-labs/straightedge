# Copy to config.toml (gitignored). Secrets belong in the environment:
#   export MT5_LOGIN=12345678
#   export MT5_PASSWORD=...
#   export MT5_SERVER=YourBroker-Demo
# Names: the bot = this Python process. the desk = Telegram chat commands.
# the agent = Cloudflare Computer worker. the gateway = AI Gateway mt5-risk-bot.

[account]
mode = "paper"              # paper | mt5 | mt4
initial_balance = 10000.0

[mt5]
terminal_path = ""
timeout_ms = 60000
# login / password / server: leave empty. Use env vars.

[mt4]
# Common Files folder. Attach mt4/Experts/Mt4RiskBot.mq4 to one chart.
# Windows: leave empty (defaults to %APPDATA%\MetaQuotes\Terminal\Common\Files)
# or set MT4_FILES_DIR. %APPDATA% in this value expands.
files_dir = ""
timeout_ms = 5000
# The SEND budget, for the ops that can change the book (market, working,
# modify_*, cancel, close, close_by). Separate from timeout_ms above because the
# two failures do not cost the same: a read that times out is retried by the next
# step, while a send that times out is AMBIGUOUS (filled, in flight, or never
# sent) and the desk cannot tell which. The default is DERIVED from the Expert's
# own worst case, not chosen: 1000ms measured transport ceiling + 950ms of
# Sleep inside the Expert's retry ladders + 360ms of claim-open retries + 19
# broker round trips at a 250ms allowance = 7060. See constants.py and
# docs/MT4.md. The desk REFUSES to start if this is at or below timeout_ms, or
# inside the Expert's Sleep total, because a desk that gives up while the Expert
# is still working is how a duplicate order becomes reachable.
#send_timeout_ms = 7060
# Seconds to wait for the Expert at STARTUP only, before giving up. A
# boot-triggered task races MT4's own launch: the terminal has to start, load,
# log in and reach the Expert's first tick, which is tens of seconds. Omit this
# key to use the built-in 180. `0` means one ping and no wait. The wait is
# always bounded and every attempt is logged with its elapsed time, so a wrong
# files_dir is still reported instead of hanging. This does NOT change
# timeout_ms, which is the per-command budget in steady state.
#startup_wait_sec = 180
# Run the desk somewhere OTHER than the MetaTrader 4 host (#73). Set this to the
# `straightedge mt4-shim` endpoint on the MT4 box and the desk stops needing to
# see files_dir at all; leave it empty for a co-located desk, which is still
# fully supported. It is checked BEFORE files_dir, because on Windows files_dir
# resolves to Common Files even when nobody set it. See docs/TRANSPORT.md.
#mailbox_url = "https://mt4-host.example.org/mt4/call"
# The shared bearer token has NO key here on purpose. It goes in the environment,
# as MT4_MAILBOX_TOKEN, on the desk AND on the shim. Minimum 32 characters, and
# there is no unauthenticated mode: this endpoint places orders.

[risk]
risk_pct = 0.005            # 0.5% of equity per trade
daily_loss_pct = 0.02       # flatten + halt for the UTC day
max_drawdown_pct = 0.10     # flatten + halt until restart after you inspect
max_positions = 3           # commitments, counting working orders as well as open positions
max_trades_per_day = 0      # opening sends per UTC day, 0 = no cap. Closes are never capped.
max_currency_exposure = 2   # net |count| per currency across commitments (open positions AND working orders)
min_rr = 1.5
max_spread_atr_frac = 0.15
min_free_margin_pct = 0.50
magic = 20260909
halt_file = "HALT"          # create this file to flatten immediately
deviation_points = 20       # max tolerated slippage in POINTS, for any symbol
                            # NOT listed below. A point is instrument-specific,
                            # so this number cannot be right everywhere.

# Minimum multiple of the LIVE spread the effective deviation must cover, or the
# send is refused as `deviation_below_spread` before it reaches the broker.
# Default 1.0, which is the only multiple that needs no measurement: a market
# order crosses the bid/ask gap, so a tolerance smaller than the spread can only
# be rejected. Raise it if you want margin; it cannot be set below 1.0, because
# there is no value that switches the gate off.
# min_deviation_spread_multiple = 1.0

# Per-symbol slippage tolerance, in POINTS. Keep this table LAST in [risk]: in
# TOML every bare key after a subtable header belongs to the subtable, so a
# `[risk]` key written below this line would land here instead.
#
# Keyed by the name YOUR BROKER uses, case-insensitive but otherwise exact. If
# your venue calls gold XAUUSD.m, write XAUUSD.m: a near-miss falls back to
# deviation_points above and is then refused as `deviation_below_spread`, which
# names the symbol and the value to set.
#
# MEASURED on the live MT4 rig 2026-09-24:
#   XAUUSD  point 0.01, spread 45 points ($0.45), ATR(14) H1 $17.22
#   EURUSD  point 0.00001, spread 1 point
# At the 20-point global default, gold was offering the venue $0.20 of tolerance
# against $0.45 of spread, i.e. less than half of one spread, on an instrument
# moving about $17 an hour. OrderSend rejected intermittently and the log named
# no cause. 150 points is $1.50, a little over three spreads.
#
# XAGUSD carries the same SHAPE (a metal quoted in cents, spread an order of
# magnitude wider in points than FX) and has NOT been measured. Treat 150 as a
# starting point for it, not as a reading.
[risk.symbol_deviation_points]
XAUUSD = 150
XAGUSD = 150

[strategy]
auto = false                # The desk is Telegram chat commands. /auto on enables the EMA regime.
trail = false               # /trail on manages existing positions each tick. Not EMA entries.
timeframe = "H1"
fast_ema = 21
slow_ema = 55
adx_period = 14
adx_min = 20.0
atr_period = 14
atr_stop_mult = 1.5
atr_tp_mult = 2.5
breakeven_r = 1.0
trail_r = 1.5
trail_atr_mult = 1.2

[symbols]
# The SCAN list: it drives /quote and the auto scan. It is not an allow list
# for what you may trade by hand.
names = ["EURUSD", "GBPUSD", "USDJPY", "AUDUSD"]

[session]
enabled = true
start_utc = "07:00"
end_utc = "17:00"
skip_friday_after_utc = "16:00"

[engine]
poll_seconds = 1            # Telegram getUpdates timeout (seconds). One loop tick after each poll (fills, SL/TP, trail, auto). If omitted, load uses 15.
comment = "straightedge"
# journal.jsonl is the fill log (SSOT). journal.tg_offset is chmod 0600. Process umask 077.
# journal.heartbeat is written each successful step_all. chmod 0600.
# Line 1 is an ISO timestamp; then blocked=, mode=, stale_after_s= and friends.
# Read it with `python -m straightedge watch`. Nothing else does.
# The staleness threshold is DERIVED from poll_seconds above, the Telegram retry
# ceiling and the venue timeout_ms below. There is deliberately no key for it:
# an operator-set alarm window is a number nobody measured. `doctor` prints it.
# journal.jsonl rotates to journal.jsonl.1 at 10 MiB.
# journal.lock is exclusive (flock / msvcrt). A second run --loop on this path exits 2.
journal_path = "journal.jsonl"

# Telegram is required for `run`. Secrets from the environment only:
#   export TELEGRAM_BOT_TOKEN=...
#   export TELEGRAM_CHAT_ID=...
#   export XAI_API_KEY=...            # Grok
#   export ANTHROPIC_API_KEY=...      # Claude
#   export AI_PROVIDER=grok           # grok | claude | computer
# The agent (workspace memory, Unified Billing on the gateway):
#   export AI_PROVIDER=computer
#   export ADVICE_URL=https://mt5-risk-agent.skyphusion.workers.dev/ask
#   export ADVICE_TOKEN=              # from agent/.dev.vars, never commit
[telegram]
# flatten_incomplete is residual exposure after a failed flatten. It is sent even
# if you leave it out of this list; see telegram.ALWAYS_NOTIFY_EVENTS.
notify_events = ["start", "stop", "open", "close", "halt", "order_check_fail", "pending", "recap", "flatten_incomplete"]
# Telegram sender ids allowed to command the desk.
# Env: TELEGRAM_ALLOW_SENDERS (comma separated). Required when chat_id is negative.
# allow_senders = [123456789]
confirm_seconds = 120
# Handover posture (#25). Both default true if left out: an unattended send
# with no human keystroke stays available, same as today. Env overrides:
# TELEGRAM_ALLOW_APPROVE_ALWAYS, TELEGRAM_ALLOW_AUTO. See config.handover.toml
# for the posture shipped to a handed-over deployment (both false).
# allow_approve_always = true
# allow_auto = true

[advice]
provider = "grok"
max_turns_per_day = 0       # advice turns per UTC day, 0 = no cap. A COST control:
                            # a turn is billed whether or not it ends in an order.
# What the MODEL may OPEN. Empty means "use [symbols].names". It never means
# "anything". A human /buy is NOT restricted by this; the model's own pick is.
symbols = []
grok_model = "grok-4"
claude_model = "claude-sonnet-5"
computer_model = "xai/grok-4.6"
# computer_url / computer_token: environment only (ADVICE_URL, ADVICE_TOKEN)
