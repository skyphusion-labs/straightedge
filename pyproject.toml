[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "straightedge"
version = "1.8.0"
description = "Risk-first MetaTrader desk. Paper by default. No profit guarantee."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Conrad Rockenhaus", email = "conrad@skyphusion.org" }]
keywords = ["metatrader", "mt5", "mt4", "trading", "risk"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.16.10", "mypy>=2.3.1"]
mt5-win = ["MetaTrader5>=5.0.45"]
mt5-mac = ["mt5-mac>=0.3.0"]

[project.scripts]
straightedge = "straightedge.__main__:main"

[project.urls]
Documentation = "docs/MT5-API.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--cov=straightedge --cov-report=term-missing --cov-fail-under=80"
markers = [
  # straightedge#258. A test carrying this mark is only correct if a wall-clock
  # budget is MET: something has to be scheduled inside a ceiling for the
  # assertion to hold. That is a different kind of test from one whose
  # correctness is independent of timing, and the suite could not tell them
  # apart, which is why ~15% of windows-latest runs went red on `main` with
  # nothing wrong. Deselect with `-m "not timing"`.
  #
  # The mark is a diagnosis aid, not a licence: a red here is still a red. It
  # says "suspect the runner before the change", which is the question that
  # cost an author an hour of proving a red was not theirs.
  "timing: correctness depends on a wall-clock budget being met",
]

[tool.coverage.run]
branch = true
source = ["straightedge"]
# `broker/base.py` used to be omitted as pure type declarations. It is not
# that any more: `venue_clock_of` is executable, it is the rule that turns a
# venue with no clock into a REFUSAL (straightedge#172), and a safety rule
# living in an omitted file is a rule whose coverage cannot be measured.
omit = []

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]


[tool.straightedge.coverage_floors]
# Per-file floors. Set from measurement, not aspiration: see tests/conftest.py
# for why a package-wide --cov-fail-under cannot go red for one file.
"src/straightedge/broker/mt4_live.py" = 97
# 100% measured. This file is the ONLY thing between a bearer token and
# OrderSend on a real account, and most of it is error-partition arms that a
# happy-path suite never reaches: a 401 that must not be retried, a 504 that
# must be, a timeout that arrives bare and a timeout that arrives wrapped. An
# arm that stops being exercised is an arm nobody would notice breaking, which
# is exactly how a wrong token would come to be retried in silence. 99 rather
# than 100 so a single `pragma: no cover` on a genuinely defensive branch does
# not turn this into a tripwire nobody can satisfy.
"src/straightedge/broker/mt4_net.py" = 99
# 99% measured. This file is the instrument that tells an operator a symbol
# cannot trade; an instrument nobody exercises is where the next silent
# degradation hides.
"src/straightedge/history.py" = 98
# 100% measured. Same argument, one step further out: this file is the only
# thing that tells an operator the desk is alive AND armed, and it runs in a
# SECOND process nobody else is watching. A branch in here that stops being
# reached is a watchdog that has quietly stopped distinguishing two states.
"src/straightedge/watchdog.py" = 99
# 100% measured. This file is the audit of the supervision itself, and the
# reason it exists is that a control which is never exercised reads exactly
# like one that works: `docs/RUNBOOK.md` documented the right scheduled tasks
# for weeks while the box had neither. Every check in here has a case that
# drives it red, including the measured 2026-10-08 live state, and a branch
# that stops being reached is a check that has stopped being able to go red.
"src/straightedge/supervision.py" = 99
# 100% measured, and it is 33 statements. The floor is here not because the
# file is large but because it is the only thing that answers "what is
# running", and every branch in it is a way of refusing to answer: a missing
# stamp, a corrupt one, one that is valid JSON but not an object, one with no
# commit. Each of those must read as `unstamped` rather than as a version, and
# a branch that stops being exercised is one of them silently becoming a guess.
"src/straightedge/deployed.py" = 99

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# E4 (import), E7 (statement), E9 (runtime error), F (pyflakes: unused
# imports/vars, undefined names, real bugs). Deliberately NOT the rest of
# E/W (style/line-length): this codebase's own idiom runs long, dense lines
# and a formatter opinion is not what this gate is for. Verified 0
# violations against src/ before this landed; a lint gate that starts red
# for pre-existing style is a rewrite, not the "cheap win" this was scoped
# as (#15 item 6).
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["src/straightedge"]
warn_unused_ignores = true

# Both overrides are one whole-file design pattern each, not a grab bag:
[[tool.mypy.overrides]]
# Desk.__init__ takes `engine: object` on purpose (desk.py and engine.py
# would otherwise import each other), so every access goes through
# getattr(self.engine, "x", default) throughout the file. mypy cannot see
# through that by construction; attr-defined would fire on nearly every
# method and the file would need a duck-typed Protocol to clear cleanly,
# which is a real design change, not this item's scope.
module = "straightedge.desk"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
# The MetaTrader5 / mt5-mac binding is an optional runtime import
# (Windows/macOS only, absent in CI); self._mt5 is typed Any | None and
# every call site relies on connect() having populated it first, a
# lifecycle invariant mypy cannot see. Same pattern at every site in this
# one file.
module = "straightedge.broker.mt5_live"
disable_error_code = ["union-attr"]
